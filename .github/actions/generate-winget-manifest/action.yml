name: Generate winget manifest
description: Generate, validate, install, and invoke the tombi winget manifest.

inputs:
  release-tag:
    description: GitHub release tag that hosts the installer assets (e.g. v1.2.3).
    required: true
  version:
    description: Stable version number without the leading v (e.g. 1.2.3).
    required: true
  wingetcreate-path:
    description: Path to a verified wingetcreate.exe (see the setup-wingetcreate action).
    required: true
  github-token:
    description: GitHub token used to read the release metadata.
    required: true
  output-dir:
    description: Directory the generated manifest is written into.
    required: false
    default: winget-manifests

runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        REF_NAME: ${{ inputs.release-tag }}
        VERSION: ${{ inputs.version }}
        WINGETCREATE_PATH: ${{ inputs.wingetcreate-path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        $x64InstallerUrl = "https://github.com/tombi-toml/tombi/releases/download/$env:REF_NAME/tombi-cli-$env:VERSION-x86_64-pc-windows-msvc.zip"
        $arm64InstallerUrl = "https://github.com/tombi-toml/tombi/releases/download/$env:REF_NAME/tombi-cli-$env:VERSION-aarch64-pc-windows-msvc.zip"

        $headers = @{
          "Accept" = "application/vnd.github+json"
          "Authorization" = "Bearer $env:GITHUB_TOKEN"
          "X-GitHub-Api-Version" = "2022-11-28"
        }
        $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/tombi-toml/tombi/releases/tags/$env:REF_NAME"
        if (-not $release.body -or -not $release.html_url -or -not $release.published_at) {
          throw "GitHub release metadata is incomplete for $env:REF_NAME."
        }
        $releaseDate = ([DateTimeOffset]$release.published_at).ToString("yyyy-MM-dd")

        $manifestDir = Join-Path $PWD $env:OUTPUT_DIR
        & $env:WINGETCREATE_PATH update tombi-toml.tombi --urls "$x64InstallerUrl|x64" "$arm64InstallerUrl|arm64" -v $env:VERSION --release-date $releaseDate --release-notes-url $release.html_url --out $manifestDir -t $env:GITHUB_TOKEN

        $installerManifest = Get-ChildItem -Path $manifestDir -Recurse -Filter "*.installer.yaml" | Select-Object -First 1
        if (-not $installerManifest) {
          throw "winget installer manifest was not generated."
        }

        # wingetcreate does not emit InstallationMetadata, so inject it manually.
        # The -notmatch guard keeps this idempotent if a future version starts emitting it.
        $content = Get-Content $installerManifest.FullName -Raw
        if ($content -notmatch "(?m)^InstallationMetadata:") {
          $installationMetadata = @(
            "InstallationMetadata:"
            "  DefaultInstallLocation: '%LOCALAPPDATA%\Microsoft\WinGet\Packages\tombi-toml.tombi__DefaultSource'"
            "  Files:"
            "  - RelativeFilePath: tombi.exe"
            "    FileType: launch"
            "    InvocationParameter: --version"
          ) -join "`r`n"
          $content = $content -replace "(?m)^ManifestType:", "$installationMetadata`r`nManifestType:"
          Set-Content -Path $installerManifest.FullName -Value $content -NoNewline
        }

        # wingetcreate clears version-specific ReleaseNotes and cannot populate the field.
        $localeManifest = Get-ChildItem -Path $manifestDir -Recurse -Filter "*.locale.en-US.yaml" | Select-Object -First 1
        if (-not $localeManifest) {
          throw "winget locale manifest was not generated."
        }
        $releaseNotes = ([regex]::Split($release.body.TrimEnd(), "\r?\n") | ForEach-Object { "  $_" }) -join "`r`n"
        $releaseNotesMetadata = @(
          "ReleaseNotes: |-"
          $releaseNotes
        ) -join "`r`n"
        $content = Get-Content $localeManifest.FullName -Raw
        $content = $content.Replace("ManifestType:", "$releaseNotesMetadata`r`nManifestType:")
        Set-Content -Path $localeManifest.FullName -Value $content -NoNewline

        $content = Get-Content $installerManifest.FullName -Raw
        if ($content -notmatch "(?m)^ReleaseDate: $([regex]::Escape($releaseDate))\r?$") {
          throw "winget installer manifest does not contain the GitHub release date."
        }
        $hasInvocationParameter = $content -split "\r?\n" | Where-Object {
          $_ -match "^\s+InvocationParameter: --version\s*$"
        }
        if (-not $hasInvocationParameter) {
          throw "winget installer manifest does not contain InvocationParameter: --version."
        }

        $content = Get-Content $localeManifest.FullName -Raw
        if ($content -notmatch "(?m)^ReleaseNotes: \|-\r?$") {
          throw "winget locale manifest does not contain release notes."
        }
        if ($content -notmatch "(?m)^ReleaseNotesUrl: $([regex]::Escape($release.html_url))\r?$") {
          throw "winget locale manifest does not contain the GitHub release notes URL."
        }

        if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
          throw "winget command is not available; cannot validate manifest."
        }
        $manifestVersionDir = Split-Path -Parent $installerManifest.FullName
        winget validate --manifest $manifestVersionDir --ignore-warnings

    - name: Install and invoke generated winget manifest
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        $manifestRoot = Join-Path $PWD $env:OUTPUT_DIR
        $installerManifest = Get-ChildItem -Path $manifestRoot -Recurse -Filter "*.installer.yaml" | Select-Object -First 1
        if (-not $installerManifest) {
          throw "winget installer manifest was not generated."
        }

        $manifestVersionDir = Split-Path -Parent $installerManifest.FullName
        $packageInstallDir = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages\tombi-toml.tombi__DefaultSource"
        $directExecutable = Join-Path $packageInstallDir "tombi.exe"
        $aliasExecutable = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links\tombi.exe"
        $installed = $false
        $localManifestFilesEnabled = $false
        $testFailure = $null
        $cleanupFailures = [System.Collections.Generic.List[string]]::new()

        function Assert-TombiVersion([string] $executable, [string] $kind) {
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "The $kind tombi executable was not installed at $executable."
          }

          $output = (& $executable --version 2>&1 | Out-String).Trim()
          $exitCode = $LASTEXITCODE
          Write-Host "$kind invocation output: $output"
          if ($exitCode -ne 0) {
            throw "The $kind tombi executable returned exit code $exitCode for --version."
          }

          $expected = "^tombi $([regex]::Escape($env:VERSION)) \(x86_64-pc-windows-msvc\)$"
          if ($output -notmatch $expected) {
            throw "The $kind tombi executable returned an unexpected version: $output"
          }

          return $output
        }

        try {
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to enable the winget LocalManifestFiles setting (exit code $LASTEXITCODE)."
          }
          $localManifestFilesEnabled = $true

          winget install `
            --manifest $manifestVersionDir `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings `
            --verbose-logs
          if ($LASTEXITCODE -ne 0) {
            throw "winget install failed with exit code $LASTEXITCODE."
          }
          $installed = $true

          # Match the two executable paths invoked by the winget validation service.
          $directVersion = Assert-TombiVersion $directExecutable "direct"
          $aliasVersion = Assert-TombiVersion $aliasExecutable "portable alias"
          if ($directVersion -ne $aliasVersion) {
            throw "The direct and portable alias tombi version outputs differ."
          }
        }
        catch {
          $testFailure = $_
          $wingetLogDir = Join-Path $env:LOCALAPPDATA "Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir"
          if (Test-Path -LiteralPath $wingetLogDir -PathType Container) {
            Write-Host "Recent winget diagnostic logs:"
            Get-ChildItem -LiteralPath $wingetLogDir -Filter "*.log" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 3 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Tail 200
              }
          }
        }
        finally {
          $installationExists = $installed `
            -or (Test-Path -LiteralPath $directExecutable -PathType Leaf) `
            -or (Test-Path -LiteralPath $aliasExecutable -PathType Leaf)
          if ($installationExists) {
            winget uninstall `
              --id tombi-toml.tombi `
              --exact `
              --accept-source-agreements `
              --disable-interactivity
            if ($LASTEXITCODE -ne 0) {
              $cleanupFailures.Add("winget uninstall failed with exit code $LASTEXITCODE.")
            }
          }

          if ($localManifestFilesEnabled) {
            winget settings --disable LocalManifestFiles
            if ($LASTEXITCODE -ne 0) {
              $cleanupFailures.Add("Failed to disable the winget LocalManifestFiles setting (exit code $LASTEXITCODE).")
            }
          }
        }

        if ($testFailure) {
          $cleanupFailures | ForEach-Object { Write-Warning $_ }
          throw $testFailure
        }
        if ($cleanupFailures.Count -gt 0) {
          throw ($cleanupFailures -join " ")
        }
