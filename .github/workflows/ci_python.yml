name: CI Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOMBI_CACHE_HOME: ${{ github.workspace }}/.cache/tombi

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        uses: $/.github/actions/relevant-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          paths: |
            .cargo/**
            mise.toml
            .github/actions/relevant-changes/**
            Cargo.toml
            Cargo.lock
            pyproject.toml
            uv.lock
            crates/**
            extensions/**
            rust/**
            xtask/**
            schemas/**
            www.schemastore.org/**
            www.schemastore.tombi/**
            www.tombi.dev/**
            python/**
            tombi.toml
            type-test.toml
            .github/workflows/ci_python.yml

  ci-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "python uv rust"
      - name: Create Tombi cache directory
        run: mkdir -p "$TOMBI_CACHE_HOME"
      - uses: actions/cache@v4.3.0
        with:
          path: ${{ env.TOMBI_CACHE_HOME }}
          key: ${{ runner.os }}-tombi-cache-${{ hashFiles('Cargo.lock', 'uv.lock', 'schemas/**', 'www.schemastore.org/**', 'www.schemastore.tombi/**', 'tombi.toml', 'type-test.toml') }}
          restore-keys: |
            ${{ runner.os }}-tombi-cache-
      - run: uv run --frozen --only-group dev ruff format --check
      - run: uv run --frozen --only-group dev ruff check --no-fix
      - run: uv run --frozen --package tombi pytest python/tombi/tests
      - run: uv run --frozen --package tombi-lib pytest python/tombi-lib/tests
