name: CI Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUSTUP_MAX_RETRIES: 10
  CARGO_PROFILE_TEST_DEBUG: 0
  TOMBI_CACHE_HOME: ${{ github.workspace }}/.cache/tombi

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        uses: $/.github/actions/relevant-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
          paths: |
            .cargo/**
            .config/nextest.toml
            mise.toml
            .npmrc
            .github/actions/relevant-changes/**
            Cargo.toml
            Cargo.lock
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            clippy.toml
            rustfmt.toml
            toml.ungram
            crates/**
            extensions/**
            rust/**
            typescript/@tombi-toml/lib/**
            typescript/@tombi-toml/lib-*/**
            typescript/@tombi-toml/wasm-lib/**
            typescript/@tombi-toml/wasm-lsp/**
            editors/zed/**
            toml-test/**
            xtask/**
            schemas/**
            www.schemastore.org/**
            www.schemastore.tombi/**
            tombi.toml
            type-test.toml
            .github/workflows/ci_rust.yml

  ci-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      TOMBI_HTTP_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "rust"
      - name: Create Tombi cache directory
        run: mkdir -p "$TOMBI_CACHE_HOME"
      - uses: actions/cache@v4.3.0
        with:
          path: ${{ env.TOMBI_CACHE_HOME }}
          key: ${{ runner.os }}-tombi-cache
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.81.8
        with:
          tool: nextest
      - name: Build
        run: cargo build --verbose --locked
      - name: Run tests
        run: cargo nextest run --verbose --locked

  cargo-shear:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "rust"
      - uses: cargo-bins/cargo-binstall@v1.14.1
      - run: cargo binstall --no-confirm cargo-shear
      - run: cargo shear

  wasm:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [lib, lsp]
    name: wasm (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "node pnpm rust"
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: wasm32-unknown-unknown-${{ matrix.variant }}
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Run WASM Clippy
        run: cargo clippy --locked -p tombi-wasm --target wasm32-unknown-unknown --no-default-features --features ${{ matrix.variant }} -- -D warnings
      - name: Build WASM package
        run: pnpm --dir typescript/@tombi-toml/wasm-${{ matrix.variant }} build
      - name: Run WASM smoke tests
        run: pnpm --dir typescript/@tombi-toml/wasm-${{ matrix.variant }} test

  node-lib:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "node pnpm rust"
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: node-lib
      - name: Run Node.js library Clippy
        run: cargo clippy --locked -p tombi-lib-node -- -D warnings
      - name: Build Node.js library binding
        run: pnpm --dir typescript/@tombi-toml/lib build
      - name: Check generated type definitions are up to date
        run: git diff --exit-code typescript/@tombi-toml/lib/binding.d.ts
      - name: Run Node.js library smoke tests
        run: pnpm --dir typescript/@tombi-toml/lib test
