name: CI Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUSTUP_MAX_RETRIES: 10
  CARGO_PROFILE_TEST_DEBUG: 0
  TOMBI_CACHE_HOME: ${{ github.workspace }}/.cache/tombi

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/relevant-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
          paths: |
            .cargo/**
            .config/nextest.toml
            .node-version
            .npmrc
            .github/actions/relevant-changes/**
            Cargo.toml
            Cargo.lock
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            rust-toolchain.toml
            clippy.toml
            rustfmt.toml
            toml.ungram
            crates/**
            extensions/**
            rust/**
            typescript/@tombi-toml/wasm-lib/**
            typescript/@tombi-toml/wasm-lsp/**
            editors/zed/**
            toml-test/**
            xtask/**
            schemas/**
            www.schemastore.org/**
            www.schemastore.tombi/**
            tombi.toml
            type-test.toml
            .github/workflows/ci_rust.yml

  ci-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      TOMBI_HTTP_TIMEOUT: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create Tombi cache directory
        run: mkdir -p "$TOMBI_CACHE_HOME"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOMBI_CACHE_HOME }}
          key: ${{ runner.os }}-tombi-cache
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@e616db6d3d80e86d787ef4a5373e3a4b74c50db2 # nextest
      - name: Build
        run: cargo build --verbose --locked
      - name: Run tests
        run: cargo nextest run --verbose --locked

  cargo-shear:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cargo-bins/cargo-binstall@8aac5aa2bf0dfaa2863eccad9f43c68fe40e5ec8 # v1.14.1
      - run: cargo binstall --no-confirm cargo-shear
      - run: cargo shear

  wasm:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: wasm32-unknown-unknown
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Run library WASM Clippy
        run: cargo clippy --locked -p tombi-wasm --target wasm32-unknown-unknown --no-default-features --features lib -- -D warnings
      - name: Run LSP WASM Clippy
        run: cargo clippy --locked -p tombi-wasm --target wasm32-unknown-unknown --no-default-features --features lsp -- -D warnings
      - name: Build WASM package variants
        run: |
          pnpm --dir typescript/@tombi-toml/wasm-lib build
          pnpm --dir typescript/@tombi-toml/wasm-lsp build
      - name: Run WASM smoke tests
        run: |
          pnpm --dir typescript/@tombi-toml/wasm-lib test
          pnpm --dir typescript/@tombi-toml/wasm-lsp test
