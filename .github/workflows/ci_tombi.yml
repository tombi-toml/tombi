name: CI Tombi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  TOMBI_CACHE_HOME: ${{ github.workspace }}/.cache/tombi

jobs:
  tombi:
    name: format --check / lint (branch build)
    runs-on: ubuntu-latest
    env:
      TOMBI_HTTP_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "rust"
      - name: Create Tombi cache directory
        run: mkdir -p "$TOMBI_CACHE_HOME"
      - uses: actions/cache@v4.3.0
        with:
          path: ${{ env.TOMBI_CACHE_HOME }}
          key: ${{ runner.os }}-tombi-cache
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: tombi-cli
      - name: Build tombi from this branch
        run: cargo build --locked -p tombi-cli
      - name: Format check
        run: ./target/debug/tombi format --check
      - name: Lint
        run: ./target/debug/tombi lint
