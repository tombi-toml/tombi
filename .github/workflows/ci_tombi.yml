name: CI Tombi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  TOMBI_CACHE_HOME: ${{ github.workspace }}/.cache/tombi

jobs:
  tombi:
    name: format --check / lint (branch build)
    runs-on: ubuntu-latest
    env:
      TOMBI_HTTP_TIMEOUT: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create Tombi cache directory
        run: mkdir -p "$TOMBI_CACHE_HOME"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TOMBI_CACHE_HOME }}
          key: ${{ runner.os }}-tombi-cache
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: tombi-cli
      - name: Build tombi from this branch
        run: cargo build --locked -p tombi-cli
      - name: Format check
        run: ./target/debug/tombi format --check
      - name: Lint
        run: ./target/debug/tombi lint
