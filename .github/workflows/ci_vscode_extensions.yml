name: CI VSCode Extensions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        uses: $/.github/actions/relevant-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          paths: |
            mise.toml
            .npmrc
            .github/actions/relevant-changes/**
            biome.json
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            editors/vscode/**
            .github/workflows/ci_vscode_extensions.yml

  ci-vscode-extensions:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "node pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check Biome schema version
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const config = JSON.parse(fs.readFileSync("biome.json", "utf8"));
          const schema = config.$schema ?? "";
          const match = schema.match(/^https:\/\/biomejs\.dev\/schemas\/([^/]+)\/schema\.json$/);
          if (!match) {
            console.error(`Invalid Biome schema URL: ${schema}`);
            process.exit(1);
          }

          const biomePackage = JSON.parse(
            fs.readFileSync("node_modules/@biomejs/biome/package.json", "utf8"),
          );
          if (match[1] !== biomePackage.version) {
            console.error(
              `Biome schema version mismatch: biome.json uses ${match[1]}, but @biomejs/biome is ${biomePackage.version}`,
            );
            process.exit(1);
          }
          NODE
      - run: pnpm run build
        working-directory: ./editors/vscode
      - run: pnpm run format:check
        working-directory: ./editors/vscode
      - run: pnpm run lint:check
        working-directory: ./editors/vscode
      - run: pnpm run typecheck
        working-directory: ./editors/vscode
      - run: pnpm run test
        working-directory: ./editors/vscode
