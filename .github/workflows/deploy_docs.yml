name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        uses: $/.github/actions/relevant-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          paths: |
            docs/**
            crates/**
            extensions/**
            rust/serde_tombi/**
            rust/tombi-wasm/**
            typescript/@tombi-toml/wasm-lib/**
            typescript/@tombi-toml/wasm-lsp/**
            .github/actions/relevant-changes/**
            mise.toml
            .npmrc
            Cargo.toml
            Cargo.lock
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .github/workflows/deploy_docs.yml

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.relevant == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "node pnpm rust"
          cache: false


      - name: Install dependencies
        working-directory: ./docs
        run: pnpm install --frozen-lockfile

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build
        working-directory: ./docs
        run: pnpm run build
        env:
          BASE_URL: /tombi

      - name: Setup Pages
        uses: actions/configure-pages@v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "./docs/.output/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
