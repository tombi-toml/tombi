name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to rebuild (leave empty for main)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  dispatch-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build release docs from main workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run deploy_docs.yml --ref main --field version="${RELEASE_TAG}"

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: $/.github/actions/relevant-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          paths: |
            docs/**
            crates/**
            extensions/**
            rust/serde_tombi/**
            rust/tombi-wasm/**
            typescript/@tombi-toml/wasm-lib/**
            typescript/@tombi-toml/wasm-lsp/**
            .github/actions/relevant-changes/**
            .github/pages/**
            mise.toml
            .npmrc
            Cargo.toml
            Cargo.lock
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .github/workflows/deploy_docs.yml

  deploy:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.relevant == 'true')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}
          persist-credentials: true
      - name: Select site version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-main}"
          if [ "${version}" != "main" ] && ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${version}" >&2
            exit 1
          fi
          echo "name=${version}" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v5.0.0
        with:
          install_args: "node pnpm rust"
          cache: false


      - name: Install dependencies
        working-directory: ./docs
        run: pnpm install --frozen-lockfile

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build
        working-directory: ./docs
        run: pnpm run build
        env:
          BASE_URL: /tombi/${{ steps.version.outputs.name }}

      - name: Prepare versioned site
        env:
          SITE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add --detach pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages pages
          fi

          rm -rf "pages/${SITE_VERSION}"
          mkdir "pages/${SITE_VERSION}"
          cp -a docs/.output/public/. "pages/${SITE_VERSION}/"
          git show "${main_sha}:.github/pages/index.html" > pages/index.html
          git show "${main_sha}:.github/pages/404.html" > pages/404.html
          touch pages/.nojekyll
          if [ "${SITE_VERSION}" = "main" ]; then
            cp docs/public/install.sh docs/public/install.ps1 pages/
            if [ "$(git rev-parse HEAD)" != "${main_sha}" ]; then
              echo "A newer main commit exists; refusing to deploy stale docs." >&2
              exit 1
            fi
          fi

          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "docs: deploy ${SITE_VERSION}"
            git -C pages push origin HEAD:gh-pages
          fi
          mkdir site
          rsync -a --exclude=.git pages/ site/

      - name: Setup Pages
        uses: actions/configure-pages@v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
