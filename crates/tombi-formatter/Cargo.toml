[package]
name = "tombi-formatter"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
itertools.workspace = true
log.workspace = true
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tombi-ast-syntax.workspace = true
tombi-comment-directive.workspace = true
tombi-comment-directive-serde.workspace = true
tombi-config.workspace = true
tombi-diagnostic.workspace = true
tombi-document-tree-syntax.workspace = true
tombi-future.workspace = true
tombi-hashmap.workspace = true
tombi-parser.workspace = true
tombi-regex.workspace = true
tombi-schema-store = { workspace = true, features = ["ast-syntax"] }
tombi-text.workspace = true
tombi-uri.workspace = true
tombi-validator.workspace = true
tombi-version-sort.workspace = true
tombi-x-keyword.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true
serde_tombi.workspace = true
textwrap.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tombi-test-lib.workspace = true

[features]
jsonschema = ["dep:schemars", "serde", "tombi-config/jsonschema"]
serde = ["dep:serde"]

[lints]
workspace = true
