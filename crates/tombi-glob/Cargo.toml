[package]
name = "tombi-glob"
version.workspace = true
edition.workspace = true

[features]
default = []
profile = ["dep:serde_tombi", "dep:tombi-schema-store"]

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
required-features = ["profile"]

[dependencies]
fast-glob.workspace = true
ignore.workspace = true
log.workspace = true
rayon.workspace = true
serde_tombi = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tombi-config.workspace = true
tombi-fs.workspace = true
tombi-schema-store = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
