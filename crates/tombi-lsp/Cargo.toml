[package]
name = "tombi-lsp"
version.workspace = true  # Inherit workspace version for `tombi lsp` version log
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
futures.workspace = true
itertools.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_tombi.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tombi-ast.workspace = true
tombi-cache.workspace = true
tombi-comment-directive.workspace = true
tombi-comment-directive-serde.workspace = true
tombi-comment-directive-store.workspace = true
tombi-config.workspace = true
tombi-date-time.workspace = true
tombi-diagnostic = { workspace = true, features = ["lsp"] }
tombi-document-tree.workspace = true
tombi-extension.workspace = true
tombi-extension-cargo.workspace = true
tombi-extension-pyproject.workspace = true
tombi-extension-tombi.workspace = true
tombi-formatter.workspace = true
tombi-fs.workspace = true
tombi-glob.workspace = true
tombi-hashmap.workspace = true
tombi-json.workspace = true
tombi-linter.workspace = true
tombi-parser.workspace = true
tombi-regex.workspace = true
tombi-rg-tree.workspace = true
tombi-schema-store = { workspace = true, features = ["document-tree"] }
tombi-schema-type.workspace = true
tombi-syntax.workspace = true
tombi-text = { workspace = true, features = ["lsp"] }
tombi-toml-text.workspace = true
tombi-uri.workspace = true
tombi-validator.workspace = true
tombi-x-keyword.workspace = true
tower-lsp.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true
tempfile.workspace = true
textwrap.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
tombi-test-lib.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_tombi = { workspace = true, features = ["native"] }
tombi-extension-cargo = { workspace = true, features = ["native"] }
tombi-extension-pyproject = { workspace = true, features = ["native"] }
tombi-future = { workspace = true, features = ["native"] }
tombi-schema-store = { workspace = true, features = ["native"] }
tower-lsp = { workspace = true, features = ["runtime-tokio"] }

[target.'cfg(target_family = "wasm")'.dependencies]
serde_tombi = { workspace = true, features = ["wasm"] }
tombi-extension-cargo = { workspace = true, features = ["wasm"] }
tombi-extension-pyproject = { workspace = true, features = ["wasm"] }
tombi-future = { workspace = true, features = ["wasm", "wasm-send"] }
tombi-schema-store = { workspace = true, features = ["wasm"] }
tower-lsp = { workspace = true, features = ["runtime-agnostic"] }

[lints]
workspace = true
