[package]
name = "tombi-extension-cargo"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Tombi extension for Cargo.toml"
repository.workspace = true
license.workspace = true

[dependencies]
futures.workspace = true
glob.workspace = true
itertools.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tombi-ast.workspace = true
tombi-cache.workspace = true
tombi-config.workspace = true
tombi-document-tree.workspace = true
tombi-extension.workspace = true
tombi-extension-manifest.workspace = true
tombi-future.workspace = true
tombi-hashmap.workspace = true
tombi-parser.workspace = true
tombi-schema-store.workspace = true
tombi-text.workspace = true
tombi-uri.workspace = true
tombi-version-sort.workspace = true
tombi-fs.workspace = true
tower-lsp.workspace = true

[features]
default = ["native"]
native = [
  "tokio/fs",
  "tombi-future/native",
  "tombi-schema-store/native",
  "tower-lsp/runtime-tokio",
]
wasm = [
  "tombi-future/wasm-send",
  "tombi-schema-store/wasm",
  "tower-lsp/runtime-agnostic",
]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tombi-test-lib.workspace = true

[lints]
workspace = true
