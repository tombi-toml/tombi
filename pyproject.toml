#:tombi toml-version = "v1.0.0"

[dependency-groups]
dev = [
  "maturin>=1.5,<2.0",
  "pytest>=9.0.3",
  "ruff>=0.7.4",
  { include-group = "stub" },
]
stub = [
  "pytest-stub>=1.1.0",
]

[tool.pytest]
addopts = ["-v"]

[tool.uv.workspace]
members = [
  "python/tombi",
  "python/tombi-beta",
  "python/tombi-lib",
]
