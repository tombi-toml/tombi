[project]
name = "tombi-lib"
version = "0.0.0-dev"
description = "Tombi formatter and linter library API for Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ya7010", email = "ya7010@outlook.com" }]
dependencies = []

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "../../rust/tombi-lib-python/Cargo.toml"
module-name = "tombi_lib._tombi_lib"
python-source = "src"
