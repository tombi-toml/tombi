[package]
name = "tombi-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Tombi formatter, linter, and language server for WebAssembly"
repository.workspace = true
license.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook.workspace = true
futures = { workspace = true, optional = true }
js-sys.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
tombi-fs = { workspace = true, optional = true }
tombi-lib = { workspace = true, default-features = false, optional = true }
tombi-lsp = { workspace = true, optional = true }
tombi-uri = { workspace = true, optional = true }
tower-lsp = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wasm-streams = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[features]
default = ["lib"]
lib = [
  "dep:serde",
  "dep:serde_json",
  "dep:serde-wasm-bindgen",
  "dep:tombi-fs",
  "dep:tombi-lib",
  "dep:tombi-uri",
  "tombi-lib/wasm",
]
lsp = [
  "dep:futures",
  "dep:serde",
  "dep:serde-wasm-bindgen",
  "dep:tombi-fs",
  "dep:tombi-lsp",
  "dep:tombi-uri",
  "dep:tower-lsp",
  "dep:wasm-streams",
  "dep:web-sys",
  "tower-lsp/runtime-agnostic",
  "wasm-bindgen-futures/futures-core-03-stream",
  "web-sys/WritableStream",
  "web-sys/console",
]

[lints]
workspace = true
